<!DOCTYPE html>
<html> 
    <head>
        <title>Background Image Example</title>
        <style>
            .mydiv{
                width: 500px;
                height: 100px;
                background-image: url('download (1).jpg');
                border: 10px solid black;
            }
            #mydiv{
                
                background-size: cover;
                background-repeat: no-repeat;
                background-position: left;
            }
        </style>

    </head>
    <body>
        <div class ="mydiv" id="mydiv"></div>
        
    </body>
</html>
