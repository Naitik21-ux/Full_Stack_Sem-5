<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grid Photo Gallery</title>
        <style>
            :root{
                --primary-color: #007bff;
                --secondary-color: #6c757d;
                --text-color:pink;
                --btn-width: 200px;
                --btn-height: 50px;
            }
            div{
                --primary-color: brown;
                --text-size: 30px;
            }
            button{
                background-color: var(--primary-color);
                color: var(--text-color);
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                width: var(--btn-width);
                height: var(--btn-height);
            }
            p{
                color: var(--primary-color);
                font-size: var(--text-size);
            }

            @layer {
                .para{
                    border: 1px solid var(--primary-color);
                    padding: 65px;
                }
            }
        </style>
    </head>
    <body>
        <button>yuuuuuuu</button>
        <div class="para">
            <p>hello j</p>
        </div>
        
    </body>
</html>
