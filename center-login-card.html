<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login card</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            display: flex;
            justify-content: center;
            align-items: center-top;
            width: 300px;
            height: 300px;
            background-color: black;
            color: aliceblue;
            font-size: 30px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 10px 10px 20px black;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: green;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: space-between;
        }

        .repeting-boxes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-shrink: 2;
            flex-grow: 2;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="login">login

            <form>
                <input type="text" placeholder="Username" id="username" name="username">
                <input type="password" placeholder="Password" id="password" name="password">
                <button type="submit">Login</button>
        </div>

        <div class="navbar">
            <nav>
                <h3>Syntra</h3>
                <div class="nav-links">
                    <a href="#">About</a>
                    <a href="#">Price</a>
                    <a href="#">Pricing</a>
                    <a href="#">Contact</a>
                </div>
                <button >Book a demo</button>

            </nav>
        </div class="repeting-boxes">

    </div>
</body>
</html>
