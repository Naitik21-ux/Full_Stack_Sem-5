<!DOCTYPE html>
<html>
<head>

    <title>Responsive Admin Dashboard</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
        }

        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .dashboard{
            display: grid;
            grid-template-columns: 200px 1fr 1fr 1fr;
            grid-template-rows: 80px 150px 200px 150px;
            gap: 15px;
        }

        .box{
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
        }

        .header{
            grid-column: 1 / 5;
            background-color: #4CAF50;
        }

        .sidebar{
            grid-row: 2 / 5;
            background-color: aqua;
        }

        .stats1{
            grid-column: 2;
            background-color: #2196F3;
        }

        .stats2{
            grid-column: 3;
            background-color: #2196F3;
        }

        .stats3{
            grid-column: 4;
            background-color: #2196F3;
        }

        .content{
            grid-column: 2 / 4;
            grid-row: 3;
            background-color: tomato;
        }

        .activity{
            grid-column: 4;
            grid-row: 3;
            background-color: #f1f1f1;
        }

        .users{
            grid-column: 2;
            background-color: lightgray;
        }

        .messages{
            grid-column: 3;
            background-color: beige;
        }

        .notifications {
            grid-column: 4;
            background-color: pink;
        }


        /* TABLET */

        @media (max-width: 900px) {

            .dashboard {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto;
            }

            .header {
                grid-column: 1 / 3;
            }

            .sidebar {
                grid-column: 1 / 3;
                grid-row: auto;
            }

            .stats1,
            .stats2,
            .stats3 {
                grid-column: auto;
            }

            .content {
                grid-column: 1 / 3;
                grid-row: auto;
            }

            .activity {
                grid-column: 1 / 3;
                grid-row: auto;
            }

            .users,
            .messages,
            .notifications {
                grid-column: auto;
            }

        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .header,
            .sidebar,
            .stats1,
            .stats2,
            .stats3,
            .content,
            .activity,
            .users,
            .messages,
            .notifications {
                grid-column: 1;
                grid-row: auto;
            }

        }

    </style>

</head>

<body>

    <div class="dashboard">

        <div class="box header">
            <h2>Header</h2>
        </div>

        <div class="box sidebar">
            <h2>Sidebar</h2>
        </div>

        <div class="box stats1">
            <h2>Stats 1</h2>
        </div>
        <div class="box stats2">
            <h2>Stats 2</h2>
        </div>

        <div class="box stats3">
            <h2>Stats 3</h2>
        </div>
        <div class="box content">
            <h2>Main Content</h2>
        </div>

        <div class="box activity">
            <h2>Activity</h2>
        </div>
        <div class="box users">
            <h2>Users</h2>
        </div>
        <div class="box messages">
            <h2>Messages</h2>
        </div>
        <div class="box notifications">
            <h2>Notifications</h2>
        </div>
    </div>
</body>
</html>
