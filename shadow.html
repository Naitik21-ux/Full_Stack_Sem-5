<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shadow Page</title>
        <style>
            div{
                width: 300px;
                height: 300px;
                box-shadow: 10px 10px 20px black;
                text-shadow: 2px 2px 4px green;
                display: flex;
                align-items: center;
                justify-content: center;
                
            }
            p{
                font-size: 25px;
                text-shadow: 1px 2px 0px red;
                color: appleblue;
                text-align: center;
                font-family: Arial, sans-serif;
                font-weight: bold;
                font-style: italic;
                text-decoration: underline;
                letter-spacing: 25px;
                word-spacing: 10px;
                text-transform: uppercase;

            }
            img{
                width: 100px;
                filter: drop-shadow(0px 3px 4px green);
            }
        </style>
    </head>
    <body>
        <div>
            <h1>Shadow Box Example</h1>
            
        </div>
        <p>This is a simple test page.</p>
        <img src="C:\Users\naiti\Downloads\top-removebg-preview.png" alt="Example Image">
    </body>
</html>
