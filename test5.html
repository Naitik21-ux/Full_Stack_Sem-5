<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        .container {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        .box {

            height: 300px;
            background: radial-gradient(ellipse at 75% 50%, rgba(0,183,255,.45),rgba(0,183,255,.12)54%,transparent 25%);
        }
            </style>
</head>

    <div class="container">
        <div class="box"></div>
    </div>
    
</body>
</html>
