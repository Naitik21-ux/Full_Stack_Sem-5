<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gradient Page</title>
        <style>
            .container {
                width: 300px;
                height: 300px;
                border: 20px solid transparent;
                background: linear-gradient(violet, indigo, red) padding-box, linear-gradient( blue, green, yellow, orange) border-box;
                

            }

            h1 {
                color: white;
                background: linear-gradient(90deg, violet, indigo, blue, green, yellow, orange, red);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-stroke: 6px transparent;
                
            }
        </style>
    </head>
    <body>
        <div class="container">
        </div>
        <h1>Gradient Box Example</h1>
    </body>
</html>
